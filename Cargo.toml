[workspace]
members = ["WorldGeneration", "nworld-map"]
# Plain `cargo run` and `cargo build` at the top level use the editor.
default-members = ["WorldGeneration"]
resolver = "3"

# Terrain generation is noise-heavy; keep `cargo run` smooth without needing --release.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
