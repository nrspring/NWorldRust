[package]
name = "nworld-game"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "game"
path = "src/main.rs"

[dependencies]
nworld-map = { path = "../nworld-map" }
nworld-view = { path = "../nworld-view" }
macroquad = "0.4"
# The saved days are plain JSON, so other tools can read them for statistics.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
